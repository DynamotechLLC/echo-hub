name: Bug report
description: Something in Echo Hub renders wrong, errors, or does not work.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A bug we can reproduce gets fixed; one we cannot usually stalls, so please fill in every required field.
        Before you start, check [Troubleshooting](https://github.com/DynamotechLLC/echo-hub#troubleshooting) and the [existing issues](https://github.com/DynamotechLLC/echo-hub/issues?q=is%3Aissue).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest Echo Hub release and reloaded the browser (cache cleared) after updating.
          required: true
        - label: button-card is installed, and auto-entities too if I use the generator or the copy-paste YAML.
          required: true
  - type: dropdown
    id: option
    attributes:
      label: How do you install Echo Hub?
      options:
        - Choose one
        - "Option 1: Strategy (custom:echo-hub)"
        - "Option 2: Generator"
        - "Option 3: Copy-paste YAML"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you see, and on which view (Home, Cameras, a room panel, the dock...).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem, starting from a working dashboard.
      placeholder: |
        1. Create a dashboard with the options below
        2. Open the Home view
        3. Tap ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        Strategy: the dashboard's raw configuration (Edit → ⋮ → Raw configuration editor). Generator: your layout.yaml. Copy-paste YAML: the part you changed.
        Only the smallest part that reproduces the bug. Replace names you do not want public; keep the entity domains (light., camera., ...).
      render: yaml
    validations:
      required: true
  - type: input
    id: echo_version
    attributes:
      label: Echo Hub version
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: cards
    attributes:
      label: Card versions
      description: From HACS. Add Advanced Camera Card if the bug is in the Cameras view.
      placeholder: "button-card 7.0.1, auto-entities 1.16.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Chrome 141 on Windows, Home Assistant app on a Fire tablet, ..."
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Echo Hub (light)
        - Echo Hub (dark)
        - Another theme
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open the developer tools (F12) → Console, reload the dashboard, and paste anything red. Write "none" if it is empty.
      render: shell
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Hide anything private, such as camera images.
