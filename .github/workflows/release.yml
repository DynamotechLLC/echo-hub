name: Release
on:
  push:
    tags: ["v*"]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: npm ci && pip install pyyaml
      - run: python -m unittest discover -s tests -v && python -m unittest discover -s generator -v
      - run: npm test
      - run: ./scripts/check-generated.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/echo-hub.js --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env: {GH_TOKEN: "${{ github.token }}"}
