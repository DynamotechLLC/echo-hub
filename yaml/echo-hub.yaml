- title: Cameras
  path: cameras
  type: panel
  cards:
  - type: custom:button-card
    template: echo-camshell
    name: Cameras
    custom_fields:
      home:
        card:
          type: custom:button-card
          template: echo-round-view
          icon: mdi:home
          variables:
            view: home
      cams:
        card:
          type: custom:advanced-camera-card
          card_id: cams
          cameras:
          - camera_entity: camera.front_door
            id: camera.front_door
            dimensions:
              aspect_ratio: '16:9'
              layout:
                fit: cover
            title: Front Door
          live:
            display:
              mode: grid
              grid_columns: 4
              grid_selected_width_factor: 1
            lazy_load: false
            controls:
              thumbnails:
                mode: none
          dimensions:
            aspect_ratio_mode: unconstrained
