                        - entity_id: media_player.this_device*
                        - entity_id: media_player.everywhere
                        - hidden_by: user
                        - hidden_by: integration
            a_office:
              card:
                type: custom:button-card
                template: echo-panel
                name: Office
                custom_fields:
                  body:
                    card:
                      type: custom:auto-entities
                      show_empty: true
