                            type: custom:button-card
                            template: echo-fan
                        - area: bedroom
                          domain: switch
                          options:
                            type: custom:button-card
                            template: echo-plug
                        - area: bedroom
                          domain: media_player
                          options:
                            type: custom:button-card
